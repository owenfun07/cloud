name: Update CloudMoon game catalog

on:
  schedule:
    - cron: "0 8 * * 1" # Every Monday at 08:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch and validate CloudMoon catalog
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from pathlib import Path

          url = "https://api.prod.cloudmoonapp.com/game/simple_list"
          request = urllib.request.Request(
              url,
              headers={"User-Agent": "OwenFun-CloudMoonCatalog/1.0", "Accept": "application/json"}
          )
          with urllib.request.urlopen(request, timeout=45) as response:
              payload = json.loads(response.read().decode("utf-8"))

          if not isinstance(payload, dict) or payload.get("code") != 0:
              raise SystemExit("CloudMoon API returned an unsuccessful response.")
          games = payload.get("data", {}).get("list")
          if not isinstance(games, list) or not games:
              raise SystemExit("Catalog is empty or has an unexpected response shape.")

          required = ("package_name", "title")
          for index, game in enumerate(games):
              if not isinstance(game, dict) or any(not game.get(key) for key in required):
                  raise SystemExit(f"Invalid game record at index {index}; keeping previous catalog.")

          output = Path("game-list/games.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"Validated and saved {len(games)} catalog entries.")
          PY

      - name: Commit catalog if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game-list/games.json
          if git diff --cached --quiet; then
            echo "Catalog has not changed."
          else
            git commit -m "Update CloudMoon game catalog"
            git push
          fi
